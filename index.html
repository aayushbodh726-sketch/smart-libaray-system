<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stackline — Smart Campus Library System</title>
  <meta http-equiv="refresh" content="0; url=./public/standalone.html" />
</head>
<body>
  <p>Loading Stackline Library…</p>

  <script>
    // GitHub Pages serves the standalone file from /public/,
    // while Vite serves public/ files from the site root.
    const isGitHubPages = window.location.hostname.endsWith('github.io');

    window.location.replace(
      isGitHubPages
        ? './public/standalone.html'
        : './standalone.html'
    );
  </script>
</body>
</html>
