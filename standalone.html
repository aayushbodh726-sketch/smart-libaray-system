    // --- AUDIO TONES ---
    const playScannerSuccessBeep = () => {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(2350, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    };

    // --- BARCODE GENERATOR HELPER ---
    function generateBarcodeBars(code, targetWidth = 260) {
      const clean = (code || '9780000000000').replace(/[^0-9]/g, '') || '9780000000000';
      const bars = [];
      let currentX = 8;
      // Start guard
      bars.push({ x: currentX, width: 2 }); currentX += 4;
      bars.push({ x: currentX, width: 2 }); currentX += 4;

      for (let i = 0; i < clean.length; i++) {
        const val = parseInt(clean[i], 10);
        const w1 = (val % 3) + 1.2;
        const w2 = ((val + 1) % 2) + 1;
        bars.push({ x: currentX, width: w1 }); currentX += w1 + 2;
        bars.push({ x: currentX, width: w2 }); currentX += w2 + 3;
      }
      // Stop guard
      bars.push({ x: currentX, width: 2 }); currentX += 4;
      bars.push({ x: currentX, width: 2 });
      return bars;
    }

                </div>

                {/* Simulated Titles Quick Tray */}
                <div className="space-y-1">
                  <span className="text-[11px] font-mono-code text-[#EFE7D3]/60 block mb-1">
                    Select Book to Scan on Tray:
                  </span>
                  <div className="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto">
                    {books.slice(0, 8).map(book => (
                      <button
                        key={book.id}
                        onClick={() => {
                          playScannerSuccessBeep();
                          setIsScannerOpen(false);
                          setInspectingBook(book);
                        }}
                        className="text-left p-2 rounded bg-[#152922] hover:bg-[#28493b] border border-[#EFE7D3]/10 text-xs font-mono-code group"
                      >
                        <div className="font-bold truncate text-[#FAF5E8] group-hover:text-[#B8923F]">{book.title}</div>
                        <div className="text-[10px] text-[#EFE7D3]/60">{book.isbn}</div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
